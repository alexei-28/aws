server:
  port: 8081
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

  tomcat:
    connection-timeout: 5s
    max-swallow-size: 11MB

spring:
  application:
    name: document-storage-service

  mvc:
    servlet:
      path: /api/v1

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 1MB
      location: ${java.io.tmpdir}

  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  storage:
    # Регион и bucket задаются через окружение
    # AWS Console
    # https://eu-north-1.console.aws.amazon.com/console
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:eu-central-1}
    max-file-size: 10485760
    allowed-content-types:
      - application/pdf
      - image/jpeg
      - image/png
      - text/plain

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false

logging:
  level:
    root: INFO
    org.springframework.web: INFO
