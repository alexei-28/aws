server:
  port: 8082

spring:
  application:
    name: task-lambda

  mvc:
    servlet:
      path: /api/v1

app:
  aws:
    region: ${AWS_REGION:eu-north-1}
    queue-url: ${AWS_SQS_QUEUE_URL}
    bucket: ${AWS_S3_BUCKET}
    dynamodb:
      jobs-table: document_jobs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true