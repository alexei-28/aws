# Кастомная конфигурация окружения
app:
  environment: Local

server:
  port: 8080

spring:
  mvc:
    servlet:
      path: /api/v1

# Actuator settings.
management:
  endpoints:
    web:
      exposure:
        include:
        #- beans
        - health
        - info
        - metrics
  endpoint:
    health:
      show-details: always