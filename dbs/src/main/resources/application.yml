server:
  port: 8084

spring:
  application:
    name: dbs
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://localhost:5432/aws_dbs_document_hub
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  mvc:
    servlet:
      path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - env    # only in dev mode
          - beans  # only in dev mode

  endpoint:
    health:
      probes:
        enabled: true